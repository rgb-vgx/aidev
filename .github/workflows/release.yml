# pushing a v* tag runs the gate, builds the archives with scripts/build-release.sh and publishes them with SHA256SUMS as a GitHub release, which install.sh downloads.
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: sh scripts/build-release.sh
        env:
          VERSION: ${{ github.ref_name }}
          DIST: dist
      - name: Extract release notes
        run: |
          if ! grep -q "^## ${{ github.ref_name }}" CHANGELOG.md; then
            echo "CHANGELOG.md has no \"## ${{ github.ref_name }}\" heading" >&2
            exit 1
          fi
          awk -v tag="${{ github.ref_name }}" '
            $0 == "## " tag {p=1; print; next}
            p && /^## / {exit}
            p
          ' CHANGELOG.md > dist/NOTES.md
      - run: gh release create "${{ github.ref_name }}" dist/aidev_*.tar.gz dist/SHA256SUMS --title "${{ github.ref_name }}" --notes-file dist/NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
